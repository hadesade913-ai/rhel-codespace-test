version: '3.8'

services:
  normal-vm:
    build:
      context: .
      dockerfile: Dockerfile.normal
    volumes:
      - ../:/workspace:cached
    command: sleep infinity

  hardened-vm:
    build:
      context: .
      dockerfile: Dockerfile.hardened
    volumes:
      - ../:/workspace:cached
    command: sleep infinity
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
